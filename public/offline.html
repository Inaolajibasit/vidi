<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#090909" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Offline | vidi</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #090909;
        color: #f1efe7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem
          max(1.25rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 85% 10%, #111469 0, transparent 30%),
          #090909;
      }
      main {
        width: min(100%, 28rem);
      }
      .logo {
        color: #ffd628;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: -0.08em;
      }
      .bar {
        width: 4rem;
        height: 0.5rem;
        margin-top: 4rem;
        background: #2227f7;
      }
      .label {
        margin: 1.75rem 0 0;
        color: #ffd628;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: clamp(3rem, 16vw, 5rem);
        line-height: 0.86;
        letter-spacing: -0.055em;
        text-transform: uppercase;
      }
      p {
        margin: 1.5rem 0 0;
        color: #a3a3a3;
        font-size: 1rem;
        line-height: 1.55;
      }
      button {
        width: 100%;
        min-height: 3.5rem;
        margin-top: 2rem;
        border: 0;
        border-radius: 0.375rem;
        background: #ffd628;
        color: #090909;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ffd628;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">vidi.</div>
      <div class="bar" aria-hidden="true"></div>
      <p class="label">You're offline</p>
      <h1>The game needs a connection.</h1>
      <p>
        Reconnect to create, join, or continue a game. Any answers already
        queued on this device will sync when you return.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
